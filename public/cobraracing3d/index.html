<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cobra Racing 3D</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            touch-action: none;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlays */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
        }

        .top-hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .lap-info {
            background: rgba(0, 0, 0, 0.6);
            border-left: 4px solid #00f2ff;
            padding: 10px 20px;
            border-radius: 0 10px 10px 0;
        }

        .lap-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00f2ff;
            font-weight: 900;
        }

        .lap-count {
            font-size: 24px;
            font-weight: 900;
        }

        .timer-info {
            background: rgba(0, 0, 0, 0.6);
            border-right: 4px solid #ff004c;
            padding: 10px 20px;
            border-radius: 10px 0 0 10px;
            text-align: right;
        }

        .timer-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff004c;
            font-weight: 900;
        }

        .timer-value {
            font-size: 24px;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
        }

        .bottom-hud {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
        }

        .speed-gauge {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 30px;
            border-radius: 20px;
            border: 1px solid rgba(0, 242, 255, 0.3);
            text-align: center;
            min-width: 120px;
        }

        .speed-value {
            font-size: 36px;
            font-weight: 900;
            color: #00f2ff;
            font-style: italic;
        }

        .speed-unit {
            font-size: 10px;
            text-transform: uppercase;
            color: #666;
        }

        .nitro-bar-container {
            width: 200px;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 5px;
        }

        .nitro-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff004c, #ff6b9d);
            width: 100%;
            transition: width 0.1s linear;
        }

        /* Controls */
        #mobile-controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: none;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .control-group {
            display: flex;
            gap: 20px;
            pointer-events: auto;
        }

        .btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 900;
            backdrop-blur: 5px;
            transition: all 0.1s;
        }

        .btn:active {
            background: rgba(0, 242, 255, 0.3);
            border-color: #00f2ff;
            scale: 0.9;
        }

        .btn-large {
            width: 90px;
            height: 90px;
        }

        .btn-nitro {
            background: rgba(255, 0, 76, 0.2);
            border-color: rgba(255, 0, 76, 0.4);
        }

        .btn-nitro:active {
            background: rgba(255, 0, 76, 0.6);
            border-color: #ff004c;
        }

        /* Menu */
        #menu-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s;
        }

        #menu-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .logo {
            font-size: 48px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 10px;
            text-align: center;
        }

        .logo span {
            color: #00f2ff;
        }

        .menu-btns {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 250px;
        }

        .menu-btn {
            padding: 20px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .menu-btn:hover {
            background: #00f2ff;
            scale: 1.05;
        }

        .menu-btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .loading-screen {
            position: absolute;
            inset: 0;
            background: #050505;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .progress-container {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: #00f2ff;
            width: 0%;
        }

        @media (max-width: 768px) {
            #mobile-controls {
                display: flex;
            }
            .top-hud {
                padding-top: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading-screen" class="loading-screen">
            <div class="logo">COBRA <span>RACING</span></div>
            <div class="progress-container">
                <div id="loading-progress" class="progress-bar"></div>
            </div>
            <p id="loading-text" style="color: #666; font-size: 10px; text-transform: uppercase; margin-top: 10px; letter-spacing: 2px;">Carregando Motores...</p>
        </div>

        <div id="menu-overlay">
            <div class="logo">COBRA <span>RACING</span></div>
            <div class="menu-btns">
                <button id="start-btn" class="menu-btn">Correr Agora</button>
                <button id="select-car-btn" class="menu-btn menu-btn-secondary">Garagem</button>
            </div>
        </div>

        <div id="hud">
            <div class="top-hud">
                <div class="lap-info">
                    <div class="lap-label">Volta</div>
                    <div id="lap-count" class="lap-count">1 / 3</div>
                </div>
                <div class="timer-info">
                    <div class="timer-label">Tempo</div>
                    <div id="timer-value" class="timer-value">00:00.00</div>
                </div>
            </div>

            <div class="bottom-hud">
                <div class="speed-gauge">
                    <div id="speed-value" class="speed-value">0</div>
                    <div class="speed-unit">km/h</div>
                    <div class="nitro-bar-container">
                        <div id="nitro-bar" class="nitro-bar"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="mobile-controls">
            <div class="control-group">
                <div id="btn-left" class="btn">L</div>
                <div id="btn-right" class="btn">R</div>
            </div>
            <div class="control-group">
                <div id="btn-nitro" class="btn btn-nitro">NITRO</div>
                <div id="btn-brake" class="btn">FREIO</div>
                <div id="btn-accel" class="btn btn-large">IR</div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
