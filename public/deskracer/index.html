<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desk Racer - Corrida de Mesa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Orbitron:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/deskracer/src/style.css" />
  </head>
  <body>
    <!-- 3D WebGL Canvas Mount -->
    <div id="canvas-container"></div>

    <!-- Helmet Visor Overlay -->
    <div id="helmet-visor-overlay" class="hidden">
      <div class="visor-vignette"></div>
    </div>

    <!-- Subtle Corner Vignette Behind HUD Elements -->
    <div id="hud-corner-vignette"></div>

    <!-- Streamlined HUD Overlay -->
    <div id="hud-root">
      <!-- Top Row -->
      <header class="hud-top-bar">
        <div class="hud-top-left-stack">
          <div
            id="hud-brand-logo"
            class="hud-brand-title"
            role="button"
            tabindex="0"
            title="Clique para abrir Menu de Câmeras e Controles"
          >Desk Racer</div>
        </div>

        <div class="hud-settings-anchor">
          <div class="hud-top-right-row">
            <div id="hud-lap-widget" class="hud-lap-widget">
              <div id="hud-lap-header" class="hud-lap-header">
                VOLTA <span id="hud-lap-curr" class="hud-lap-curr">1</span>/3
              </div>
              <div id="hud-lap-timer" class="hud-lap-timer" aria-label="00:00.00"><span class="timer-digit" id="lap-d0">0</span><span class="timer-digit" id="lap-d1">0</span><span class="timer-sep">:</span><span class="timer-digit" id="lap-d2">0</span><span class="timer-digit" id="lap-d3">0</span><span class="timer-sep">.</span><span class="timer-digit" id="lap-d4">0</span><span class="timer-digit" id="lap-d5">0</span></div>
              <div id="hud-lap-split" class="hud-lap-split hidden"></div>
            </div>

            <button
              id="btn-hud-start"
              class="hud-action-btn hud-btn-start"
              type="button"
              aria-label="Iniciar Corrida (Enter)"
              title="Iniciar Corrida (Enter)"
            >
              <svg class="action-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <span>INÍCIO</span>
            </button>

            <button
              id="btn-hud-pause"
              class="hud-action-btn hud-btn-pause"
              type="button"
              aria-label="Pausar / Retomar Jogo (P)"
              title="Pausar / Retomar Jogo (P)"
            >
              <svg id="icon-pause-svg" class="action-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="6" y="4" width="4" height="16"></rect>
                <rect x="14" y="4" width="4" height="16"></rect>
              </svg>
              <svg id="icon-play-svg" class="action-svg hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <span id="hud-pause-label">PAUSA</span>
            </button>

            <button
              id="btn-mute-sound"
              class="hud-mute-btn is-muted"
              type="button"
              aria-label="Mudar Som (M)"
              title="Mudar Som (M)"
            >
              <svg id="icon-sound-on" class="mute-svg hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
              </svg>
              <svg id="icon-sound-off" class="mute-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <line x1="23" y1="9" x2="17" y2="15"></line>
                <line x1="17" y1="9" x2="23" y2="15"></line>
              </svg>
            </button>
          </div>
        </div>
      </header>

      <!-- Welcome Dialog -->
      <div id="welcome-dialog-overlay" class="welcome-dialog-overlay">
        <div class="welcome-dialog-card" role="dialog" aria-labelledby="welcome-title">
          <div class="welcome-eyebrow">CIRCUITO DE MESA · 3 VOLTAS</div>
          <h1 id="welcome-title" class="welcome-title">DESK RACER</h1>

          <div class="welcome-controls-grid">
            <div class="welcome-control-block">
              <div class="welcome-control-label">CONTROLES</div>
              <div class="control-keys-list">
                <div class="control-key-row">
                  <div class="control-kbd-pair"><kbd class="welcome-key">W</kbd></div>
                  <span>ACELERAR</span>
                </div>
                <div class="control-key-row">
                  <div class="control-kbd-pair"><kbd class="welcome-key">A</kbd><kbd class="welcome-key">D</kbd></div>
                  <span>VIRAR / ESTERÇAR</span>
                </div>
                <div class="control-key-row">
                  <div class="control-kbd-pair"><kbd class="welcome-key">S</kbd></div>
                  <span>FREIAR</span>
                </div>
              </div>
            </div>

            <div class="welcome-control-block">
              <div class="welcome-control-label">CÂMERAS DO JOGO</div>
              <div class="cam-keys-list">
                <div class="cam-key-row cam-pill active" data-cam="1"><kbd class="welcome-key welcome-key-cyan">1</kbd><span>VISÃO TRASEIRA</span></div>
                <div class="cam-key-row cam-pill" data-cam="2"><kbd class="welcome-key welcome-key-cyan">2</kbd><span>COCKPIT (PILOTO)</span></div>
                <div class="cam-key-row cam-pill" data-cam="3"><kbd class="welcome-key welcome-key-cyan">3</kbd><span>VISÃO GERAL MESA</span></div>
                <div class="cam-key-row cam-pill" data-cam="4"><kbd class="welcome-key welcome-key-cyan">4</kbd><span>VISÃO DO DRONE</span></div>
              </div>
            </div>
          </div>

          <div class="welcome-footer">
            <button id="btn-welcome-start" class="welcome-start-btn" type="button">
              <div id="welcome-btn-progress-fill" class="welcome-btn-progress-fill"></div>
              <span id="welcome-start-text">CARREGANDO CIRCUITO...</span>
              <kbd id="welcome-enter-kbd" class="welcome-key">ENTER</kbd>
            </button>
          </div>
        </div>
      </div>

      <!-- Bottom HUD -->
      <footer class="hud-bottom-bar">
        <div class="hud-bottom-left">
          <div class="hud-speedo-gauge">
            <div class="speedo-label">KM/H</div>
            <div id="hud-speedo-value" class="speedo-value">0</div>
          </div>
        </div>
        <div class="hud-bottom-right">
          <div class="hud-minimap-widget">
            <div class="minimap-track-layer">
              <svg id="minimap-svg" viewBox="-120 -120 240 240" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
                <path id="minimap-track-path" d=""></path>
              </svg>
              <div id="minimap-kart-dot" class="minimap-kart-dot"></div>
            </div>
          </div>
        </div>
      </footer>
    </div>

    <!-- Mobile Controls -->
    <div class="mobile-touch-controls hidden">
      <div class="mobile-ctrl-cluster cluster-left">
        <button id="touch-left" class="mobile-ctrl-btn mobile-ctrl-steer" type="button">
          <div class="mobile-ctrl-inner">
            <svg class="mobile-ctrl-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
            <span class="mobile-ctrl-label">A</span>
          </div>
        </button>
        <button id="touch-right" class="mobile-ctrl-btn mobile-ctrl-steer" type="button">
          <div class="mobile-ctrl-inner">
            <svg class="mobile-ctrl-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
            <span class="mobile-ctrl-label">D</span>
          </div>
        </button>
      </div>
      <div class="mobile-ctrl-cluster cluster-right">
        <button id="touch-brake" class="mobile-ctrl-btn mobile-ctrl-brake" type="button">
          <div class="mobile-ctrl-inner">
            <svg class="mobile-ctrl-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 10h12M6 14h12"/></svg>
            <span class="mobile-ctrl-label">S</span>
          </div>
        </button>
        <button id="touch-accel" class="mobile-ctrl-btn mobile-ctrl-accel" type="button">
          <div class="mobile-ctrl-inner">
            <svg class="mobile-ctrl-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            <span class="mobile-ctrl-label">W</span>
          </div>
        </button>
      </div>
    </div>

    <script type="module" src="/deskracer/bundle.js"></script>
  </body>
</html>
