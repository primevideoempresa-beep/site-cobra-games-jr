<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Turbo Rush 3D - Supercars</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0c16; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #fff; user-select: none; }

#game-container { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; }

/* Canvas 3D background */
#canvas-3d { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: block; }

/* Overlay screens */
.ui-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 24px 16px; background: rgba(10, 12, 22, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
.ui-screen.active { opacity: 1; pointer-events: auto; }

/* Menu Header & Logo */
.brand-header { text-align: center; margin-top: 10px; }
.brand-title { font-size: 38px; font-weight: 900; letter-spacing: -1px; background: linear-gradient(135deg, #fff 0%, #7bbfff 50%, #378ADD 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; text-shadow: 0 10px 30px rgba(55,138,221,0.4); }
.brand-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 14px; background: rgba(230, 0, 18, 0.2); border: 1px solid rgba(230, 0, 18, 0.5); border-radius: 20px; color: #ff4d4d; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

/* Showroom Selection Cards */
.showroom-panel { width: 100%; max-width: 680px; background: rgba(22, 33, 62, 0.85); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 24px; padding: 18px 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 16px; }

.section-title { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #8a99ad; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }

/* Supercar Selector Carousel */
.car-selector { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
.car-selector::-webkit-scrollbar { display: none; }

.car-card { flex: 0 0 120px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 10px; cursor: pointer; text-align: center; transition: all 0.2s ease; }
.car-card:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
.car-card.active { border-color: #378ADD; background: rgba(55,138,221,0.25); box-shadow: 0 0 20px rgba(55,138,221,0.4); }
.car-card-name { font-size: 13px; font-weight: 800; color: #fff; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.car-card-brand { font-size: 10px; color: #7bbfff; font-weight: 700; text-transform: uppercase; }

/* Color Swatches */
.color-picker { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.color-swatch { width: 34px; height: 34px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform 0.15s ease, border-color 0.15s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
.color-swatch:hover { transform: scale(1.15); }
.color-swatch.active { border-color: #ffffff; transform: scale(1.2); box-shadow: 0 0 15px rgba(255,255,255,0.8); }

/* Difficulty Selector */
.diff-selector { display: flex; gap: 8px; }
.diff-btn { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); color: #a0aec0; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; }
.diff-btn.active { background: #378ADD; color: #fff; border-color: #378ADD; box-shadow: 0 0 15px rgba(55,138,221,0.4); }

/* Buttons */
.btn-primary { width: 100%; max-width: 320px; padding: 16px 32px; border-radius: 16px; border: none; background: linear-gradient(135deg, #e60012 0%, #ff4d4d 100%); color: #fff; font-size: 18px; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer; box-shadow: 0 10px 30px rgba(230,0,18,0.5); transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 10px; }
.btn-primary:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 40px rgba(230,0,18,0.7); }
.btn-primary:active { transform: translateY(1px); }

/* HUD Header */
#hud-container { position: absolute; top: 0; left: 0; width: 100%; z-index: 5; pointer-events: none; padding: 16px 20px; display: none; justify-content: space-between; align-items: flex-start; }
#hud-container.active { display: flex; }

.hud-panel { background: rgba(10, 12, 22, 0.65); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(8px); border-radius: 16px; padding: 10px 18px; display: flex; align-items: center; gap: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.hud-stat { display: flex; flex-direction: column; }
.hud-label { font-size: 10px; font-weight: 800; color: #718096; text-transform: uppercase; letter-spacing: 0.5px; }
.hud-val { font-size: 20px; font-weight: 900; color: #fff; line-height: 1.1; }

.hud-lives { display: flex; gap: 4px; }
.hud-heart { font-size: 18px; color: #e60012; text-shadow: 0 0 10px rgba(230,0,18,0.6); }
.hud-heart.lost { color: #333d4d; text-shadow: none; }

/* Speedometer & Nitro Bar */
.hud-speedo { text-align: right; }
.speedo-num { font-size: 28px; font-weight: 900; color: #378ADD; letter-spacing: -1px; text-shadow: 0 0 20px rgba(55,138,221,0.6); }
.speedo-unit { font-size: 11px; font-weight: 800; color: #a0aec0; }

.nitro-bar-wrap { width: 120px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin-top: 4px; border: 1px solid rgba(255,255,255,0.15); }
.nitro-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #0055ff, #00d4ff, #ff00ea); border-radius: 4px; transition: width 0.1s linear; box-shadow: 0 0 10px #00d4ff; }

/* Game Controls Bar (Touch / Mobile / Desktop overlay) */
#controls-bar { position: absolute; bottom: 20px; left: 0; width: 100%; z-index: 6; pointer-events: auto; display: none; justify-content: space-between; align-items: center; padding: 0 20px; }
#controls-bar.active { display: flex; }

.ctrl-btn { width: 62px; height: 62px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); backdrop-filter: blur(6px); color: #fff; font-size: 24px; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.1s ease; touch-action: manipulation; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
.ctrl-btn:active, .ctrl-btn.pressed { background: rgba(55,138,221,0.5); border-color: #378ADD; transform: scale(0.92); }

.ctrl-btn-nitro { width: 74px; height: 74px; border-radius: 20px; background: linear-gradient(135deg, #0055ff, #ff00ea); border: 2px solid rgba(255,255,255,0.4); box-shadow: 0 0 25px rgba(255,0,234,0.6); font-size: 13px; font-weight: 900; letter-spacing: 1px; flex-direction: column; gap: 2px; }

.ctrl-group { display: flex; gap: 12px; align-items: center; }

/* Game Over Modal */
.gameover-box { width: 100%; max-width: 440px; background: rgba(16, 22, 40, 0.9); border: 1px solid rgba(255,255,255,0.15); border-radius: 28px; padding: 28px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; gap: 18px; }
.go-title { font-size: 36px; font-weight: 900; color: #ff4d4d; letter-spacing: -1px; text-shadow: 0 0 20px rgba(255,77,77,0.5); }
.go-stats { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 10px 0; }
.go-stat-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 12px; }
.go-stat-val { font-size: 22px; font-weight: 900; color: #fff; }
.go-stat-lbl { font-size: 11px; color: #8a99ad; font-weight: 700; text-transform: uppercase; }

/* Ads Banner */
.ads-wrapper { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); z-index: 20; width: 100%; max-width: 400px; text-align: center; pointer-events: auto; }
</style>
<!-- Three.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-container">
  <!-- 3D Canvas -->
  <canvas id="canvas-3d"></canvas>

  <!-- HUD -->
  <div id="hud-container">
    <div class="hud-panel">
      <div class="hud-stat">
        <span class="hud-label">PONTOS</span>
        <span class="hud-val" id="hud-score">0</span>
      </div>
      <div class="hud-stat">
        <span class="hud-label">MOEDAS</span>
        <span class="hud-val" id="hud-coins" style="color:#ffd700;">$0</span>
      </div>
      <div class="hud-stat">
        <span class="hud-label">VIDAS</span>
        <div class="hud-lives" id="hud-lives"></div>
      </div>
    </div>

    <div class="hud-panel hud-speedo">
      <div>
        <div class="speedo-num" id="hud-speed">0 <span class="speedo-unit">KM/H</span></div>
        <div class="nitro-bar-wrap">
          <div class="nitro-bar-fill" id="nitro-fill"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Touch Controls -->
  <div id="controls-bar">
    <div class="ctrl-group">
      <button class="ctrl-btn" id="ctrl-left" aria-label="Esquerda">◄</button>
      <button class="ctrl-btn" id="ctrl-right" aria-label="Direita">►</button>
    </div>
    <div class="ctrl-group">
      <button class="ctrl-btn" id="ctrl-brake" aria-label="Freio" style="font-size:12px; font-weight:900;">FREIO</button>
      <button class="ctrl-btn ctrl-btn-nitro" id="ctrl-nitro" aria-label="Nitro">
        <span>⚡</span>
        <span>NITRO</span>
      </button>
    </div>
  </div>

  <!-- MENU / SHOWROOM SCREEN -->
  <div class="ui-screen active" id="menu-screen">
    <div class="brand-header">
      <div class="brand-title">TURBO RUSH 3D</div>
      <div class="brand-badge">🏎️ SUPERCARS EDITION</div>
    </div>

    <div class="showroom-panel">
      <!-- Supercar Models -->
      <div>
        <div class="section-title">
          <span>MODELO DO SUPERCARRO</span>
          <span id="selected-car-specs" style="color:#378ADD;">FERRARI LAFERRARI</span>
        </div>
        <div class="car-selector" id="car-selector"></div>
      </div>

      <!-- Supercar Colors -->
      <div>
        <div class="section-title">COR DA PINTURA METÁLICA (PBR)</div>
        <div class="color-picker" id="color-picker"></div>
      </div>

      <!-- Difficulty -->
      <div>
        <div class="section-title">DIFICULDADE DA PISTA</div>
        <div class="diff-selector">
          <button class="diff-btn" data-diff="easy">FÁCIL</button>
          <button class="diff-btn active" data-diff="normal">NORMAL</button>
          <button class="diff-btn" data-diff="hard">PILOTO PRO</button>
        </div>
      </div>
    </div>

    <button class="btn-primary" id="btn-start">
      <span>▶ JOGAR AGORA</span>
    </button>
  </div>

  <!-- GAME OVER SCREEN -->
  <div class="ui-screen" id="gameover-screen">
    <div class="gameover-box">
      <div class="go-title" id="go-title">GAME OVER</div>
      <p style="color:#a0aec0; font-size:14px;" id="go-subtitle">Corrida finalizada!</p>
      
      <div class="go-stats">
        <div class="go-stat-card">
          <div class="go-stat-lbl">Pontuação</div>
          <div class="go-stat-val" id="go-score">0</div>
        </div>
        <div class="go-stat-card">
          <div class="go-stat-lbl">Moedas</div>
          <div class="go-stat-val" id="go-coins" style="color:#ffd700;">$0</div>
        </div>
        <div class="go-stat-card">
          <div class="go-stat-lbl">Vel. Máxima</div>
          <div class="go-stat-val" id="go-maxspeed">0 KM/H</div>
        </div>
        <div class="go-stat-card">
          <div class="go-stat-lbl">Carros Desviados</div>
          <div class="go-stat-val" id="go-dodged">0</div>
        </div>
      </div>

      <button class="btn-primary" id="btn-restart" style="width:100%; max-width:100%;">
        <span>↺ CORRER NOVAMENTE</span>
      </button>
      <button class="diff-btn" id="btn-menu" style="width:100%; padding:14px;">☰ VOLTAR AO GARAGEM</button>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   TURBO RUSH 3D ENGINE - SUPERCARS (FERRARI, LAMBORGHINI, PORSCHE, BUGATTI, MCLAREN)
   ========================================================================== */

// Supercar Definitions
const SUPERCARS = [
  {
    id: 'laferrari',
    name: 'LaFerrari SF90',
    brand: 'Ferrari',
    specs: 'TOP SPEED 350 KM/H | V12 HYBRID',
    modelType: 'laferrari'
  },
  {
    id: 'aventador',
    name: 'Aventador SVJ',
    brand: 'Lamborghini',
    specs: 'TOP SPEED 352 KM/H | V12 STEALTH',
    modelType: 'aventador'
  },
  {
    id: 'gt3rs',
    name: '911 GT3 RS',
    brand: 'Porsche',
    specs: 'TOP SPEED 320 KM/H | GT AERO WING',
    modelType: 'gt3rs'
  },
  {
    id: 'chiron',
    name: 'Chiron SuperSport',
    brand: 'Bugatti',
    specs: 'TOP SPEED 440 KM/H | W16 QUAD TURBO',
    modelType: 'chiron'
  },
  {
    id: 'mclaren',
    name: 'McLaren P1',
    brand: 'McLaren',
    specs: 'TOP SPEED 350 KM/H | DIHEDRAL AERO',
    modelType: 'mclaren'
  }
];

const COLORS = [
  { name: 'Rosso Corsa (Vermelho Ferrari)', hex: '#E60012' },
  { name: 'Giallo Modena (Amarelo Ferrari)', hex: '#FFD700' },
  { name: 'Nero Daytona (Preto Brilhante)', hex: '#121214' },
  { name: 'Verde Mantis (Verde Lamborghini)', hex: '#2BD82D' },
  { name: 'Blu Corsa (Azul Elétrico)', hex: '#0055FF' },
  { name: 'Bianco Italia (Branco Pérola)', hex: '#F2F2F7' },
  { name: 'Arancio Argos (Laranja Lambo)', hex: '#FF5500' },
  { name: 'Viola Pasifae (Roxo Metálico)', hex: '#8A2BE2' }
];

const DIFFICULTY_SETTINGS = {
  easy: { spawnRate: 110, speedMul: 0.85, lives: 4 },
  normal: { spawnRate: 75, speedMul: 1.0, lives: 3 },
  hard: { spawnRate: 50, speedMul: 1.35, lives: 2 }
};

// Global App State
let selectedCarIndex = 0;
let selectedColorHex = COLORS[0].hex;
let selectedDifficulty = 'normal';

let scene, camera, renderer, clock;
let isGameRunning = false;
let isPaused = false;

// Game State
let gameState = {
  playerCarGroup: null,
  playerLane: 2, // 0 to 4 (5 lanes)
  playerTargetX: 0,
  playerX: 0,
  playerZ: 0,
  speed: 0,
  targetSpeed: 0,
  maxSpeedReached: 0,
  score: 0,
  coins: 0,
  lives: 3,
  maxLives: 3,
  dodged: 0,
  nitro: 100,
  isBoosting: false,
  enemies: [],
  coins3D: [],
  nitro3D: [],
  particles: [],
  roadSegmentY: 0,
  spawnTimer: 0,
  coinTimer: 0,
  invincibleTimer: 0
};

// Road configuration
const LANES = [-6, -3, 0, 3, 6];
const ROAD_LENGTH = 300;

// Reusable geometries & materials cache
const materialsCache = {};

function getMetallicMaterial(colorHex) {
  if (!materialsCache[colorHex]) {
    materialsCache[colorHex] = new THREE.MeshStandardMaterial({
      color: new THREE.Color(colorHex),
      metalness: 0.85,
      roughness: 0.18,
      envMapIntensity: 1.2
    });
  }
  return materialsCache[colorHex];
}

// Sound Synthesizer (Web Audio API)
const AudioFX = {
  ctx: null,
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
  },
  playCoin() {
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(987.77, this.ctx.currentTime); // B5
      osc.frequency.setValueAtTime(1318.51, this.ctx.currentTime + 0.08); // E6
      gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.25);
    } catch(e){}
  },
  playCrash() {
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.4);
      gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.4);
    } catch(e){}
  },
  playNitro() {
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(200, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.3);
    } catch(e){}
  }
};

/* ==========================================================================
   3D PROCEDURAL SUPERCAR GEOMETRY GENERATORS (FERRARI, LAMBO, PORSCHE, BUGATTI, MCLAREN)
   ========================================================================== */

function createSupercarMesh(modelType, paintColorHex) {
  const carGroup = new THREE.Group();
  const paintMaterial = getMetallicMaterial(paintColorHex);

  // Common Materials
  const glassMat = new THREE.MeshStandardMaterial({ color: 0x111622, roughness: 0.1, metalness: 0.9, transparent: true, opacity: 0.85 });
  const blackCarbonMat = new THREE.MeshStandardMaterial({ color: 0x111113, roughness: 0.4, metalness: 0.6 });
  const chromeMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.1, metalness: 0.95 });
  const headlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const taillightMat = new THREE.MeshBasicMaterial({ color: 0xff0022 });
  const tireMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 });
  const rimMat = new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.9, roughness: 0.2 });

  if (modelType === 'laferrari') {
    // FERRARI LAFERRARI / SF90 STRADALE
    // 1. Lower Aerodynamic Body
    const bodyGeo = new THREE.BoxGeometry(2.1, 0.55, 4.4);
    const bodyMesh = new THREE.Mesh(bodyGeo, paintMaterial);
    bodyMesh.position.y = 0.45;
    bodyGroupAddShadow(bodyMesh);
    carGroup.add(bodyMesh);

    // 2. Sculpted Front Snout
    const snoutGeo = new THREE.BoxGeometry(1.95, 0.32, 1.2);
    const snoutMesh = new THREE.Mesh(snoutGeo, paintMaterial);
    snoutMesh.position.set(0, 0.35, -2.1);
    carGroup.add(snoutMesh);

    // 3. Carbon Front Splitter
    const splitter = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.08, 0.5), blackCarbonMat);
    splitter.position.set(0, 0.15, -2.4);
    carGroup.add(splitter);

    // 4. Teardrop Cabin Roof (Black Carbon Contrast)
    const cabinGeo = new THREE.BoxGeometry(1.45, 0.52, 2.0);
    const cabinMesh = new THREE.Mesh(cabinGeo, glassMat);
    cabinMesh.position.set(0, 0.88, -0.2);
    carGroup.add(cabinMesh);

    // 5. Rear Deck & Engine Cover Vents
    const engineCover = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.25, 1.4), blackCarbonMat);
    engineCover.position.set(0, 0.7, 1.2);
    carGroup.add(engineCover);

    // 6. Iconic Double Circular Taillights
    const tail1 = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.08, 16), taillightMat);
    tail1.rotation.x = Math.PI / 2;
    tail1.position.set(-0.7, 0.55, 2.21);
    const tail2 = tail1.clone();
    tail2.position.set(0.7, 0.55, 2.21);
    carGroup.add(tail1, tail2);

    // Headlight Strips
    const headL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.08, 0.5), headlightMat);
    headL.position.set(-0.75, 0.48, -2.2);
    const headR = headL.clone();
    headR.position.set(0.75, 0.48, -2.2);
    carGroup.add(headL, headR);

  } else if (modelType === 'aventador') {
    // LAMBORGHINI AVENTADOR SVJ
    // 1. Polygonal Stealth Body Chassis
    const bodyGeo = new THREE.BoxGeometry(2.25, 0.52, 4.5);
    const bodyMesh = new THREE.Mesh(bodyGeo, paintMaterial);
    bodyMesh.position.y = 0.42;
    bodyGroupAddShadow(bodyMesh);
    carGroup.add(bodyMesh);

    // 2. Angular Wedge Nose
    const noseGeo = new THREE.BoxGeometry(2.0, 0.35, 1.4);
    const noseMesh = new THREE.Mesh(noseGeo, paintMaterial);
    noseMesh.position.set(0, 0.32, -2.0);
    carGroup.add(noseMesh);

    // 3. Cabin & Sharp Windshield
    const cabinGeo = new THREE.BoxGeometry(1.5, 0.5, 1.9);
    const cabinMesh = new THREE.Mesh(cabinGeo, glassMat);
    cabinMesh.position.set(0, 0.82, -0.3);
    carGroup.add(cabinMesh);

    // 4. Massive Carbon SVJ Wing & Struts

function bodyGroupAddShadow(mesh) {

function init3DScene() {

  scene.background = new THREE.Color(0x0a0c16);

  camera.position.set(0, 4.5, 12);

  clock = new THREE.Clock();

  // Lights
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);

  keyLight.shadow.mapSize.width = 1024;
  keyLight.shadow.mapSize.height = 1024;

  keyLight.shadow.camera.far = 100;

  keyLight.shadow.camera.right = 15;
  keyLight.shadow.camera.top = 25;
  keyLight.shadow.camera.bottom = -15;

let roadMeshGroup, roadMarkingsGroup;

function buildRoadEnvironment() {
  roadMeshGroup = new THREE.Group();

  // Main Asphalt Highway (5 Lanes)
  const roadGeo = new THREE.PlaneGeometry(16, ROAD_LENGTH);
  const roadMat = new THREE.MeshStandardMaterial({ color: 0x1e2028, roughness: 0.8 });
  const roadMesh = new THREE.Mesh(roadGeo, roadMat);
  roadMesh.rotation.x = -Math.PI / 2;
  roadMesh.position.set(0, 0, -ROAD_LENGTH / 2 + 20);
  roadMesh.receiveShadow = true;
  roadMeshGroup.add(roadMesh);

  // Side Shoulders / Grass Grasslands
  const sideGeo = new THREE.PlaneGeometry(100, ROAD_LENGTH);
  const sideMat = new THREE.MeshStandardMaterial({ color: 0x0c1322, roughness: 0.9 });
  const sideLeft = new THREE.Mesh(sideGeo, sideMat);
  sideLeft.rotation.x = -Math.PI / 2;
  sideLeft.position.set(-58, -0.05, -ROAD_LENGTH / 2 + 20);
  const sideRight = sideLeft.clone();
  sideRight.position.set(58, -0.05, -ROAD_LENGTH / 2 + 20);
  roadMeshGroup.add(sideLeft, sideRight);

  // Guard Rails
  const railGeo = new THREE.BoxGeometry(0.3, 0.6, ROAD_LENGTH);
  const railMat = new THREE.MeshStandardMaterial({ color: 0x556070, metalness: 0.8, roughness: 0.3 });
  const railL = new THREE.Mesh(railGeo, railMat);
  railL.position.set(-8.15, 0.3, -ROAD_LENGTH / 2 + 20);
  const railR = railL.clone();
  railR.position.set(8.15, 0.3, -ROAD_LENGTH / 2 + 20);
  roadMeshGroup.add(railL, railR);

  // Road Dashed Line Markings
  roadMarkingsGroup = new THREE.Group();
  const lineGeo = new THREE.BoxGeometry(0.18, 0.02, 3.5);
  const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

  for (let z = 20; z > -ROAD_LENGTH + 20; z -= 8) {
    [-3.2, 0, 3.2].forEach(x => {
      const line = new THREE.Mesh(lineGeo, lineMat);
      line.position.set(x, 0.01, z);
      roadMarkingsGroup.add(line);
    });
  }
  roadMeshGroup.add(roadMarkingsGroup);

  scene.add(roadMeshGroup);
}

function updateShowroomCar() {
  if (gameState.playerCarGroup) {
    scene.remove(gameState.playerCarGroup);
  }

  const modelType = SUPERCARS[selectedCarIndex].modelType;
  gameState.playerCarGroup = createSupercarMesh(modelType, selectedColorHex);

  if (!isGameRunning) {
    // Showroom Position (Rotates gently in Garage view)
    gameState.playerCarGroup.position.set(0, 0, 0);
    gameState.playerCarGroup.rotation.set(0, Math.PI / 5, 0);
  } else {
    // In-game Position
    gameState.playerCarGroup.position.set(LANES[gameState.playerLane], 0, 0);
    gameState.playerCarGroup.rotation.set(0, 0, 0);
  }

  scene.add(gameState.playerCarGroup);
}

/* ==========================================================================
   GAMEPLAY ENGINE & LOGIC
   ========================================================================== */

function spawnEnemySupercar() {
  const laneIndex = Math.floor(Math.random() * 5);
  const laneX = LANES[laneIndex];

  // Pick random supercar model & color
  const randomModel = SUPERCARS[Math.floor(Math.random() * SUPERCARS.length)].modelType;
  const randomColor = COLORS[Math.floor(Math.random() * COLORS.length)].hex;

  const enemyMesh = createSupercarMesh(randomModel, randomColor);
  // Turn enemy to face down the highway (facing towards player)
  enemyMesh.rotation.y = Math.PI;
  enemyMesh.position.set(laneX, 0, -180 - Math.random() * 40);

  scene.add(enemyMesh);
  gameState.enemies.push({
    mesh: enemyMesh,
    lane: laneIndex,
    speed: 0.35 + Math.random() * 0.2,
    dodged: false
  });
}

function spawnCoin3D() {
  const laneIndex = Math.floor(Math.random() * 5);
  const coinGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.12, 16);
  const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.1 });
  const coinMesh = new THREE.Mesh(coinGeo, coinMat);
  coinMesh.rotation.x = Math.PI / 2;
  coinMesh.position.set(LANES[laneIndex], 0.6, -160);

  scene.add(coinMesh);
  gameState.coins3D.push({ mesh: coinMesh, collected: false });
}

function burstParticles3D(x, y, z, colorHex = 0x00d4ff) {
  for (let i = 0; i < 12; i++) {
    const pGeo = new THREE.SphereGeometry(0.12, 8, 8);
    const pMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 1 });
    const pMesh = new THREE.Mesh(pGeo, pMat);
    pMesh.position.set(x, y, z);

    const vx = (Math.random() - 0.5) * 0.3;
    const vy = Math.random() * 0.3 + 0.1;
    const vz = (Math.random() - 0.5) * 0.3;

    scene.add(pMesh);
    gameState.particles.push({ mesh: pMesh, vx, vy, vz, life: 30, maxLife: 30 });
  }
}

function startGame() {
  AudioFX.init();
  const settings = DIFFICULTY_SETTINGS[selectedDifficulty];

  gameState.playerLane = 2;
  gameState.playerX = LANES[2];
  gameState.playerTargetX = LANES[2];
  gameState.speed = 0;
  gameState.targetSpeed = 0.8 * settings.speedMul;
  gameState.maxSpeedReached = 0;
  gameState.score = 0;
  gameState.coins = 0;
  gameState.lives = settings.lives;
  gameState.maxLives = settings.lives;
  gameState.dodged = 0;
  gameState.nitro = 100;
  gameState.isBoosting = false;
  gameState.invincibleTimer = 0;

  // Clear old enemies & coins
  gameState.enemies.forEach(e => scene.remove(e.mesh));
  gameState.coins3D.forEach(c => scene.remove(c.mesh));
  gameState.particles.forEach(p => scene.remove(p.mesh));
  gameState.enemies = [];
  gameState.coins3D = [];
  gameState.particles = [];

  // Update Player Car Model & Position
  updateShowroomCar();
  gameState.playerCarGroup.position.set(LANES[2], 0, 0);
  gameState.playerCarGroup.rotation.set(0, 0, 0);

  // Camera Position for Game Play
  camera.position.set(0, 3.8, 8.5);
  camera.lookAt(0, 1.2, -10);

  // Toggle UI
  document.getElementById('menu-screen').classList.remove('active');
  document.getElementById('gameover-screen').classList.remove('active');
  document.getElementById('hud-container').classList.add('active');
  document.getElementById('controls-bar').classList.add('active');

  isGameRunning = true;
  isPaused = false;
  updateHUD();
}

function updateGame(delta) {
  if (!isGameRunning || isPaused) return;

  const settings = DIFFICULTY_SETTINGS[selectedDifficulty];

  // Nitro & Speed logic
  if (gameState.isBoosting && gameState.nitro > 0) {
    gameState.nitro = Math.max(0, gameState.nitro - 0.8);
    gameState.targetSpeed = 1.6 * settings.speedMul;
    AudioFX.playNitro();
    // Burst nitro flames behind exhaust
    if (Math.random() < 0.6) {
      burstParticles3D(gameState.playerX, 0.4, 2.2, 0x00ffff);
    }
  } else {
    gameState.targetSpeed = 0.9 * settings.speedMul;
    if (gameState.nitro < 100) gameState.nitro = Math.min(100, gameState.nitro + 0.15);
  }

  // Smooth Speed Acceleration
  gameState.speed += (gameState.targetSpeed - gameState.speed) * 0.08;
  const currentSpeedKMH = Math.floor(gameState.speed * 220);
  if (currentSpeedKMH > gameState.maxSpeedReached) {
    gameState.maxSpeedReached = currentSpeedKMH;
  }

  // Score
  gameState.score += Math.floor(gameState.speed * 2);

  // Smooth Lane Interpolation (WASD / Touch steer)
  gameState.playerTargetX = LANES[gameState.playerLane];
  gameState.playerX += (gameState.playerTargetX - gameState.playerX) * 0.25;

  if (gameState.playerCarGroup) {
    gameState.playerCarGroup.position.x = gameState.playerX;
    // Dynamic Body Tilt on Steer
    const steerDiff = gameState.playerTargetX - gameState.playerX;
    gameState.playerCarGroup.rotation.z = -steerDiff * 0.08;
    gameState.playerCarGroup.rotation.y = steerDiff * 0.05;

    // Flash when invincible after hit
    if (gameState.invincibleTimer > 0) {
      gameState.invincibleTimer--;
      gameState.playerCarGroup.visible = Math.floor(gameState.invincibleTimer / 4) % 2 === 0;
    } else {
      gameState.playerCarGroup.visible = true;
    }
  }

  // Dynamic Camera follow & FOV tilt when boosting
  const targetFOV = gameState.isBoosting ? 65 : 55;
  camera.fov += (targetFOV - camera.fov) * 0.1;
  camera.updateProjectionMatrix();

  camera.position.x = gameState.playerX * 0.3;

  // Move Road Markings
  roadMarkingsGroup.children.forEach(line => {
    line.position.z += gameState.speed * 2.8;
    if (line.position.z > 20) {
      line.position.z -= ROAD_LENGTH - 20;
    }
  });

  // Spawn Traffic & Collectibles
  gameState.spawnTimer++;
  if (gameState.spawnTimer >= Math.max(25, settings.spawnRate - Math.floor(gameState.score / 500))) {
    spawnEnemySupercar();
    gameState.spawnTimer = 0;
  }

  gameState.coinTimer++;
  if (gameState.coinTimer >= 80) {
    spawnCoin3D();
    gameState.coinTimer = 0;
  }

  // Update Enemy Supercars
  for (let i = gameState.enemies.length - 1; i >= 0; i--) {
    const enemy = gameState.enemies[i];
    enemy.mesh.position.z += (gameState.speed + enemy.speed) * 1.8;

    // Check Dodge
    if (!enemy.dodged && enemy.mesh.position.z > 5) {
      enemy.dodged = true;
      gameState.dodged++;
    }

    // Check Collision with Player
    if (gameState.invincibleTimer === 0 && Math.abs(enemy.mesh.position.z - 0) < 3.2 && Math.abs(enemy.mesh.position.x - gameState.playerX) < 1.8) {
      // Hit!
      AudioFX.playCrash();
      gameState.lives--;
      gameState.invincibleTimer = 75;
      burstParticles3D(gameState.playerX, 0.8, 0, 0xff0022);

      if (gameState.lives <= 0) {
        gameOver();
        return;
      }
    }

    // Remove passed enemies
    if (enemy.mesh.position.z > 25) {
      scene.remove(enemy.mesh);
      gameState.enemies.splice(i, 1);
    }
  }

  // Update 3D Coins
  for (let i = gameState.coins3D.length - 1; i >= 0; i--) {
    const coin = gameState.coins3D[i];
    coin.mesh.position.z += gameState.speed * 2.5;
    coin.mesh.rotation.z += 0.05;

    // Collection check
    if (!coin.collected && Math.abs(coin.mesh.position.z - 0) < 2.0 && Math.abs(coin.mesh.position.x - gameState.playerX) < 1.6) {
      coin.collected = true;
      AudioFX.playCoin();
      gameState.coins++;
      gameState.score += 150;
      burstParticles3D(coin.mesh.position.x, 0.6, coin.mesh.position.z, 0xffd700);
      scene.remove(coin.mesh);
      gameState.coins3D.splice(i, 1);
      continue;
    }

    if (coin.mesh.position.z > 25) {
      scene.remove(coin.mesh);
      gameState.coins3D.splice(i, 1);
    }
  }

  // Update Particles
  for (let i = gameState.particles.length - 1; i >= 0; i--) {
    const p = gameState.particles[i];
    p.mesh.position.x += p.vx;
    p.mesh.position.y += p.vy;
    p.mesh.position.z += p.vz;
    p.life--;
    p.mesh.material.opacity = p.life / p.maxLife;

    if (p.life <= 0) {
      scene.remove(p.mesh);
      gameState.particles.splice(i, 1);
    }
  }

  updateHUD();
}

function gameOver() {
  isGameRunning = false;
  document.getElementById('hud-container').classList.remove('active');
  document.getElementById('controls-bar').classList.remove('active');
  document.getElementById('gameover-screen').classList.add('active');

  document.getElementById('go-score').textContent = gameState.score;
  document.getElementById('go-coins').textContent = '$' + gameState.coins;
  document.getElementById('go-maxspeed').textContent = gameState.maxSpeedReached + ' KM/H';
  document.getElementById('go-dodged').textContent = gameState.dodged;

  if (gameState.score > 2500) {
    document.getElementById('go-title').textContent = '🏆 LENDÁRIO!';
    document.getElementById('go-subtitle').textContent = 'Você dominou a pista com seu Supercarro!';
  } else {
    document.getElementById('go-title').textContent = 'GAME OVER';
    document.getElementById('go-subtitle').textContent = 'Continue treinando seus reflexos!';
  }
}

function updateHUD() {
  document.getElementById('hud-score').textContent = gameState.score;
  document.getElementById('hud-coins').textContent = '$' + gameState.coins;
  document.getElementById('hud-speed').innerHTML = `${Math.floor(gameState.speed * 220)} <span class="speedo-unit">KM/H</span>`;
  document.getElementById('nitro-fill').style.width = gameState.nitro + '%';

  const livesContainer = document.getElementById('hud-lives');
  livesContainer.innerHTML = '';
  for (let i = 0; i < gameState.maxLives; i++) {
    const heart = document.createElement('span');
    heart.className = 'hud-heart' + (i >= gameState.lives ? ' lost' : '');
    heart.textContent = '❤';
    livesContainer.appendChild(heart);
  }
}

/* ==========================================================================
   RENDER LOOP & EVENT LISTENERS
   ========================================================================== */

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();

  if (!isGameRunning && gameState.playerCarGroup) {
    // Showroom Rotate Animation in Menu
    gameState.playerCarGroup.rotation.y += 0.008;
  } else {
    updateGame(delta);
  }

  renderer.render(scene, camera);
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function renderMenuUI() {
  // 1. Supercar Cards Carousel
  const carSelector = document.getElementById('car-selector');
  carSelector.innerHTML = '';
  SUPERCARS.forEach((car, idx) => {
    const card = document.createElement('div');
    card.className = 'car-card' + (idx === selectedCarIndex ? ' active' : '');

      selectedCarIndex = idx;
      renderMenuUI();
      updateShowroomCar();
    };
    card.innerHTML = `
      <div class="car-card-brand">${car.brand}</div>
      <div class="car-card-name">${car.name}</div>
    `;
    carSelector.appendChild(card);
  });

  document.getElementById('selected-car-specs').textContent = SUPERCARS[selectedCarIndex].specs;

  // 2. Color Swatches
  const colorPicker = document.getElementById('color-picker');
  colorPicker.innerHTML = '';
  COLORS.forEach(c => {
    const swatch = document.createElement('div');
    swatch.className = 'color-swatch' + (c.hex === selectedColorHex ? ' active' : '');
    swatch.style.backgroundColor = c.hex;
    swatch.title = c.name;
    swatch.onclick = () => {
      selectedColorHex = c.hex;
      renderMenuUI();
      updateShowroomCar();
    };
    colorPicker.appendChild(swatch);
  });
}

// Controls & Keyboard Bindings
document.addEventListener('keydown', e => {
  if (!isGameRunning) return;
  if (['ArrowLeft', 'a', 'A'].includes(e.key)) {
    if (gameState.playerLane > 0) gameState.playerLane--;
  } else if (['ArrowRight', 'd', 'D'].includes(e.key)) {
    if (gameState.playerLane < 4) gameState.playerLane++;
  } else if (['ArrowUp', 'w', 'W', ' '].includes(e.key)) {
    gameState.isBoosting = true;
  } else if (['ArrowDown', 's', 'S'].includes(e.key)) {
    gameState.targetSpeed = 0.4;
  }
});

document.addEventListener('keyup', e => {
  if (['ArrowUp', 'w', 'W', ' '].includes(e.key)) {
    gameState.isBoosting = false;
  }
});

// Touch / On-screen Buttons
const btnLeft = document.getElementById('ctrl-left');
const btnRight = document.getElementById('ctrl-right');
const btnNitro = document.getElementById('ctrl-nitro');
const btnBrake = document.getElementById('ctrl-brake');

btnLeft.addEventListener('pointerdown', e => { e.preventDefault(); if (gameState.playerLane > 0) gameState.playerLane--; });
btnRight.addEventListener('pointerdown', e => { e.preventDefault(); if (gameState.playerLane < 4) gameState.playerLane++; });

btnNitro.addEventListener('pointerdown', e => { e.preventDefault(); gameState.isBoosting = true; });
btnNitro.addEventListener('pointerup', e => { e.preventDefault(); gameState.isBoosting = false; });
btnNitro.addEventListener('pointerleave', e => { gameState.isBoosting = false; });

btnBrake.addEventListener('pointerdown', e => { e.preventDefault(); gameState.targetSpeed = 0.3; });

// Menu Navigation
document.getElementById('btn-start').onclick = startGame;
document.getElementById('btn-restart').onclick = startGame;
document.getElementById('btn-menu').onclick = () => {
  isGameRunning = false;
  document.getElementById('gameover-screen').classList.remove('active');
  document.getElementById('menu-screen').classList.add('active');
  camera.position.set(0, 4.5, 12);
  camera.lookAt(0, 1.2, 0);
  updateShowroomCar();
};

document.querySelectorAll('.diff-btn[data-diff]').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.diff-btn[data-diff]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedDifficulty = btn.dataset.diff;
  };
});

// Initialize on Load
window.onload = () => {
  init3DScene();
  renderMenuUI();
  animate();
};
</script>
</body>
</html>
